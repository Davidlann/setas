name: Actualizar y publicar Mapa setero

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar el proyecto y la base ambiental
        uses: actions/checkout@v4

      - name: Comprobar la base de datos requerida
        run: |
          test -f backend/data/processed/mycologist_spatial.duckdb || {
            echo "::error::Falta backend/data/processed/mycologist_spatial.duckdb. Incluye la base DuckDB del proyecto en el repositorio."
            exit 1
          }

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias del actualizador
        run: python -m pip install duckdb h3 pyyaml requests numpy scipy

      - name: Guardar los últimos datos publicados
        run: |
          mkdir -p "$RUNNER_TEMP/mapa-setero-data-backup"
          cp frontend/public/data/experimental/*.json "$RUNNER_TEMP/mapa-setero-data-backup/"

      - name: Actualizar meteorología y exportar índices experimentales
        id: update_data
        continue-on-error: true
        run: |
          python -m backend.src.ingestion.dynamic.meteo_snapshots
          python -m backend.src.export_relative_suitability

      - name: Recuperar los datos publicados si falla la actualización
        if: steps.update_data.outcome == 'failure'
        run: |
          cp "$RUNNER_TEMP"/mapa-setero-data-backup/*.json frontend/public/data/experimental/
          echo "::warning::Falló la actualización meteorológica; se publicará la interfaz con los últimos datos válidos disponibles."

      - name: Validar los cuatro conjuntos de datos
        env:
          DATA_REFRESH_OUTCOME: ${{ steps.update_data.outcome }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from datetime import date, datetime
          from zoneinfo import ZoneInfo

          species = (
              "boletus_edulis",
              "boletus_aereus",
              "boletus_pinophilus",
              "boletus_reticulatus",
          )
          directory = Path("frontend/public/data/experimental")
          today = datetime.now(ZoneInfo("Europe/Madrid")).date()
          today_iso = today.isoformat()
          dataset_dates = set()
          for species_id in species:
              path = directory / f"{species_id}.json"
              with path.open(encoding="utf-8") as file:
                  dataset = json.load(file)
              dataset_date = dataset.get("date")
              try:
                  parsed_date = date.fromisoformat(dataset_date)
              except (TypeError, ValueError):
                  raise SystemExit(f"Fecha ausente o inválida: {path}")
              if (
                  dataset.get("species_id") != species_id
                  or not isinstance(dataset_date, str)
                  or parsed_date.isoformat() != dataset_date
                  or parsed_date > today
                  or dataset.get("data_quality") != "sourced_unvalidated"
                  or dataset.get("score_type") != "experimental_separated_habitat_weather"
                  or not dataset.get("cells")
              ):
                  raise SystemExit(f"Datos ausentes o inválidos: {path}")
              dataset_dates.add(dataset_date)
              if os.environ["DATA_REFRESH_OUTCOME"] == "success" and dataset_date != today_iso:
                  raise SystemExit(f"El conjunto no contiene datos de hoy: {path}")
              print(f"{species_id}: {len(dataset['cells'])} celdas, {dataset_date}")
          if len(dataset_dates) != 1:
              raise SystemExit("Los cuatro conjuntos de especies no comparten la misma fecha.")
          if os.environ["DATA_REFRESH_OUTCOME"] == "failure":
              print(f"::warning::Se conserva el último snapshot válido ({next(iter(dataset_dates))}); revisa el fallo del ETL.")
          PY

      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir el visor y los datos actualizados
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Publicar el sitio
        id: deployment
        uses: actions/deploy-pages@v4
